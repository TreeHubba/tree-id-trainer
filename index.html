<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tree ID Trainer</title>
  <meta name="theme-color" content="#2f5d34">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Tree ID Trainer</h1>
      <p id="stats-line" class="stats-line"></p>
    </header>

    <section id="home-view" class="view">
      <button id="start-key-btn" class="mode-btn">🌲 Dichotomous Key</button>
      <button id="start-flashcards-btn" class="mode-btn">🍁 Flashcards</button>
      <button id="start-browse-btn" class="mode-btn">🌿 Browse by Genus</button>
      <button id="start-compare-btn" class="mode-btn">🔍 Compare Trees</button>
      <button id="start-quiz-btn" class="mode-btn">📝 Quiz</button>
    </section>

    <section id="flashcard-select-view" class="view hidden">
      <button class="back-btn" id="flashcard-select-home-btn">&larr; Home</button>
      <button id="flashcards-species-btn" class="mode-btn">🍁 Species</button>
      <button id="flashcards-genus-btn" class="mode-btn">🧬 Genus</button>
    </section>

    <section id="browse-view" class="view hidden">
      <button class="back-btn" id="browse-home-btn">&larr; Home</button>
      <div id="browse-list"></div>
    </section>

    <section id="compare-view" class="view hidden">
      <button class="back-btn" id="compare-home-btn">&larr; Home</button>
      <h2>Compare Trees</h2>
      <fieldset class="quiz-type-fieldset">
        <legend>Tree type</legend>
        <label class="quiz-type-option"><input type="radio" name="woodFilter" value="all" checked> All trees</label>
        <label class="quiz-type-option"><input type="radio" name="woodFilter" value="softwood"> Softwood</label>
        <label class="quiz-type-option"><input type="radio" name="woodFilter" value="hardwood"> Hardwood</label>
      </fieldset>
      <div class="compare-pickers">
        <label class="compare-picker-label">
          Tree A
          <select id="compare-select-a"></select>
        </label>
        <label class="compare-picker-label">
          Tree B
          <select id="compare-select-b"></select>
        </label>
      </div>
      <button id="compare-btn" class="mode-btn">Compare</button>
      <div id="compare-results"></div>
    </section>

    <section id="quiz-setup-view" class="view hidden">
      <button class="back-btn" id="quiz-setup-home-btn">&larr; Home</button>
      <h2>Midterm Quiz</h2>

      <fieldset class="quiz-type-fieldset">
        <legend>Answer style</legend>
        <label class="quiz-type-option"><input type="checkbox" name="answerMode" value="mc" checked> Multiple choice</label>
        <label class="quiz-type-option"><input type="checkbox" name="answerMode" value="typed"> Typed answer</label>
      </fieldset>

      <button id="quiz-start-btn" class="mode-btn">Start Quiz</button>
    </section>

    <section id="quiz-view" class="view hidden">
      <button class="back-btn" id="quiz-home-btn">&larr; Home</button>
      <div class="quiz-top-row">
        <span id="quiz-progress"></span>
      </div>
      <div id="quiz-question"></div>
      <div id="quiz-answer-area"></div>
      <div id="quiz-feedback" class="hidden"></div>
      <div class="quiz-controls">
        <button id="quiz-submit-btn">Next</button>
        <button id="quiz-next-btn" class="hidden">Next</button>
      </div>
    </section>

    <section id="quiz-results-view" class="view hidden">
      <button class="back-btn" id="quiz-results-home-btn">&larr; Home</button>
      <h2>Quiz Results</h2>
      <p id="quiz-score-summary" class="quiz-score-summary"></p>
      <div id="quiz-breakdown"></div>
      <button id="quiz-retry-btn" class="mode-btn">Retry Quiz</button>
    </section>

    <section id="key-view" class="view hidden">
      <button class="back-btn" id="key-home-btn">&larr; Home</button>
      <div id="key-breadcrumb" class="key-breadcrumb"></div>
      <div id="key-question"></div>
      <div id="key-candidates" class="hidden"></div>
      <div id="key-reveal" class="hidden"></div>
      <div class="key-controls">
        <button id="key-back-btn">Back</button>
        <button id="key-restart-btn">Restart</button>
      </div>
    </section>

    <section id="flashcard-view" class="view hidden">
      <button class="back-btn" id="flash-home-btn">&larr; Home</button>
      <div class="flash-filters">
        <label><input type="radio" name="filter" value="all" checked> All</label>
        <label><input type="radio" name="filter" value="learning"> Needs Practice</label>
        <label><input type="radio" name="filter" value="known"> Known</label>
        <button id="shuffle-btn" type="button">Shuffle</button>
      </div>
      <div id="flashcard"></div>
      <div class="flash-controls hidden" id="flash-answer-controls">
        <button id="knew-it-btn">Knew it ✓</button>
        <button id="still-learning-btn">Still learning ✗</button>
      </div>
      <div class="flash-nav">
        <button id="prev-card-btn">&larr; Prev</button>
        <span id="flash-progress"></span>
        <button id="next-card-btn">Next &rarr;</button>
      </div>
    </section>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
